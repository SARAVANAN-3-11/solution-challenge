<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Citadel Archive - Certificate Scanner</title>
    <style>
        /* --- Virtual Classroom Theme --- */
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap');

        body {
            background-color: #15161A; /* Deep dark background */
            color: #E0E0E0; /* Light grey text for readability */
            font-family: 'Open Sans', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px;
            box-sizing: border-box;
        }

        .container {
            background: #222330; /* Dark card background */
            border: none;
            border-radius: 12px;
            padding: 40px;
            max-width: 1100px; 
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Open Sans', sans-serif;
            font-weight: 700;
            font-size: 32px;
            color: #D8B257; /* Golden yellow theme color */
            border-bottom: 1px solid #383A4F;
            padding-bottom: 15px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        p {
            color: #9BA0B5; /* Muted secondary text */
            font-size: 16px;
            margin-bottom: 30px;
        }

        /* --- PERFECT BUTTON ALIGNMENT FIX --- */
        .button-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px; /* Exact spacing between the buttons */
            margin-bottom: 10px;
            flex-wrap: wrap; /* Ensures they stack nicely on small phone screens */
        }

        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: block; /* Changed from inline-block to work with flex */
        }

        .btn {
            border: none;
            color: #ffffff;
            /* Blue to Gold gradient from the login button */
            background: linear-gradient(to right, #1A60B3, #D8B257);
            padding: 14px 28px;
            border-radius: 6px;
            font-family: 'Open Sans', sans-serif;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            /* Ensure buttons match height exactly */
            height: 50px; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover { 
            opacity: 0.9;
            transform: translateY(-2px);
        }
        
        .btn-export { 
            background: #1A60B3; /* Solid blue for secondary action */
        }
        
        .btn-export:hover { 
            background: #154b8f; 
        }

        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer;
        }

        #status { 
            margin-top: 10px; 
            font-style: italic; 
            color: #9BA0B5; 
            min-height: 24px; 
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            display: none; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border-radius: 8px;
            overflow: hidden;
        }
        
        th, td {
            border: 1px solid #383A4F; /* Dark subtle borders */
            padding: 14px;
            text-align: left;
            font-size: 14px;
        }
        
        th {
            background-color: #15161A; /* Darkest background for header */
            font-family: 'Open Sans', sans-serif;
            font-weight: 600;
            color: #D8B257; /* Golden yellow */
            letter-spacing: 0.5px;
        }
        
        td { 
            color: #E0E0E0; 
            background-color: #222330;
        }
        
        tr:nth-child(even) td {
            background-color: #1E1F2A; /* Slight alternating row color */
        }

        .loader {
            display: none;
            border: 4px solid #383A4F; 
            border-top: 4px solid #D8B257; /* Golden spinner */
            border-radius: 50%; 
            width: 35px; 
            height: 35px;
            animation: spin 1s linear infinite; 
            margin: 20px auto;
        }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <h1>The Citadel Archive</h1>
        <p>Send a flock of ravens. Select multiple scrolls to extract their knowledge.</p>
        
        <div class="button-container">
            <div class="upload-btn-wrapper">
                <button class="btn">Scan Certificates (Upload Multiple)</button>
                <input type="file" id="certificateInput" accept="image/*" multiple />
            </div>

            <button class="btn btn-export" id="exportBtn" style="display:none;" onclick="exportTableToCSV('Extracurricular_Activities.csv')">
                Download Excel (.csv)
            </button>
        </div>

        <div class="loader" id="loader"></div>
        <p id="status"></p>

        <table id="ledgerTable">
            <thead>
                <tr>
                    <th>S.No.</th>
                    <th>Name of the Student</th>
                    <th>Year / Sem</th>
                    <th>Name of the Activity</th>
                    <th>Venue</th>
                    <th>Date</th>
                    <th>Award</th>
                </tr>
            </thead>
            <tbody id="ledgerBody">
            </tbody>
        </table>
    </div>

<script>
        // Your API key
        const GEMINI_API_KEY = "AIzaSyCYXXd3rHvumhFggAk1iBw8pQdiUoGAsYA"; 
        
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        document.getElementById('certificateInput').addEventListener('change', async function(event) {
            const files = event.target.files;
            if (files.length === 0) return;

            const statusText = document.getElementById('status');
            const loader = document.getElementById('loader');
            const table = document.getElementById('ledgerTable');
            const tbody = document.getElementById('ledgerBody');

            loader.style.display = "block";
            let successCount = 0;
            let failCount = 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                let fileProcessed = false;
                let retryCount = 0;
                
                statusText.innerText = `The Maesters are deciphering scroll ${i + 1} of ${files.length}...`;
                statusText.style.color = "#9BA0B5";

                const base64Data = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result.split(',')[1]);
                    reader.readAsDataURL(file);
                });

                while (!fileProcessed && retryCount < 3) {
                    try {
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${GEMINI_API_KEY}`;
                        
                        const promptText = `You are an expert academic archivist. Extract details from the provided certificate image and return ONLY a raw, valid JSON object. Do not include markdown formatting, backticks, or the word 'json'. 

Use these exact keys and follow these strict rules:
1. 'studentName': The full name of the participant. Convert it to Title Case (e.g., 'John Doe', not 'JOHN DOE').
2. 'yearOrSem': The year or semester of the student (e.g., '2nd Year', 'IV Sem'). If not explicitly stated, write 'N/A'.
3. 'activityName': The specific name of the event, workshop, hackathon, or seminar.
4. 'venue': The host institution, college, or organization that issued the certificate.
5. 'date': The date of the event.
6. 'award': The type of achievement (e.g., '1st Prize', 'Winner'). If it only states they participated, attended, or completed it, write 'Participation'.`;

                        const payload = {
                            "contents": [{
                                "parts": [
                                    { "text": promptText },
                                    { "inline_data": { "mime_type": file.type, "data": base64Data } }
                                ]
                            }]
                        };

                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        const responseData = await response.json();
                        
                        if (responseData.error) {
                            if (responseData.error.code === 429 || responseData.error.code === 503) {
                                retryCount++;
                                if (retryCount >= 3) {
                                    throw new Error("Too many traffic jams. Giving up on this scroll.");
                                }
                                statusText.innerText = `Traffic jam at the Citadel! Waiting 6 seconds before retrying scroll ${i + 1}... (Attempt ${retryCount}/3)`;
                                statusText.style.color = "#D8B257"; 
                                await sleep(6000); 
                                continue; 
                            } else {
                                throw new Error(responseData.error.message);
                            }
                        }

                        const extractedText = responseData.candidates[0].content.parts[0].text;
                        const data = JSON.parse(extractedText);

                        const serialNumber = tbody.children.length + 1;

                        const row = `<tr>
                                        <td>${serialNumber}</td>
                                        <td>${data.studentName || 'N/A'}</td>
                                        <td>${data.yearOrSem || 'N/A'}</td>
                                        <td>${data.activityName || 'N/A'}</td>
                                        <td>${data.venue || 'N/A'}</td>
                                        <td>${data.date || 'N/A'}</td>
                                        <td>${data.award || 'N/A'}</td>
                                     </tr>`;
                        
                        tbody.insertAdjacentHTML('beforeend', row);
                        table.style.display = 'table';
                        document.getElementById('exportBtn').style.display = 'inline-flex'; /* ensures flex centering applies */
                        
                        successCount++;
                        fileProcessed = true; 

                        if (i < files.length - 1) {
                            statusText.innerText = `Scroll ${i + 1} logged. Resting the ravens...`;
                            statusText.style.color = "#9BA0B5";
                            await sleep(3000); 
                        }

                    } catch (error) {
                        console.error(`Failed to decipher ${file.name}:`, error);
                        fileProcessed = true; 
                        failCount++; 
                    }
                }
            }

            loader.style.display = "none";
            
            if (successCount > 0 && failCount === 0) {
                statusText.innerText = `Success! All ${successCount} scrolls have been added to the ledger.`;
                statusText.style.color = "#4CAF50"; 
            } else if (successCount > 0 && failCount > 0) {
                statusText.innerText = `Finished. ${successCount} added, but ${failCount} ravens failed.`;
                statusText.style.color = "#ff9800"; 
            } else {
                statusText.innerText = `Failed. 0 scrolls added. The ravens were blocked by the storm.`;
                statusText.style.color = "#f44336"; 
            }

            event.target.value = "";
        });

        function exportTableToCSV(filename) {
            const table = document.getElementById("ledgerTable");
            let csv = [];
            for (let i = 0; i < table.rows.length; i++) {
                let row = [], cols = table.rows[i].querySelectorAll("td, th");
                for (let j = 0; j < cols.length; j++) {
                    let data = cols[j].innerText.replace(/"/g, '""');
                    row.push('"' + data + '"');
                }
                csv.push(row.join(","));
            }
            const csvFile = new Blob([csv.join("\n")], {type: "text/csv"});
            const downloadLink = document.createElement("a");
            downloadLink.download = filename;
            downloadLink.href = window.URL.createObjectURL(csvFile);
            downloadLink.style.display = "none";
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }
    </script>
</body>
</html>
